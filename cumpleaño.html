    <script>
        // --- EFECTOS INTERACTIVOS (JavaScript) ---
        function lanzarConfeti() {
            const colores = ['#ff477e', '#ff7096', '#ff85a1', '#fbb1bd', '#f72585', '#7209b7', '#4cc9f0'];
            
            for (let i = 0; i < 100; i++) {
                const confeti = document.createElement('div');
                confeti.classList.add('confetti');
                
                // Propiedades aleatorias para cada trozo de confeti
                confeti.style.left = Math.random() * 100 + 'vw';
                confeti.style.animationDuration = (Math.random() * 2 + 2) + 's'; 
                confeti.style.backgroundColor = colores[Math.floor(Math.random() * colores.length)];
                confeti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0%';
                
                document.body.appendChild(confeti);
                
                // Limpiar el HTML para que no se sature de elementos creados
                setTimeout(() => {
                    confeti.remove();
                }, 4000);
            }
        }
    </script>
